status = warn
name = WebHarvestCliConfiguration

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %-5p [%t] %c{1} - %m%n

rootLogger.level = DEBUG
rootLogger.appenderRef.console.ref = console

logger.webharvest.name = org.webharvest
logger.webharvest.level = DEBUG
logger.plugin.name = org.webharvest.plugin
logger.plugin.level = DEBUG
logger.runtime.name = org.webharvest.runtime
logger.runtime.level = DEBUG
