status = warn
name = WebHarvestRootConfiguration

appender.stdout.type = Console
appender.stdout.name = stdout
appender.stdout.target = SYSTEM_OUT
appender.stdout.layout.type = PatternLayout
appender.stdout.layout.pattern = %d{HH:mm:ss} %-5p %c{1} - %m%n

rootLogger.level = INFO
rootLogger.appenderRef.stdout.ref = stdout

logger.templatePlugin.name = org.webharvest.plugin.core.TemplatePlugin
logger.templatePlugin.level = DEBUG
logger.filePlugin.name = org.webharvest.plugin.core.FilePlugin
logger.filePlugin.level = DEBUG
logger.plugin.name = org.webharvest.plugin
logger.plugin.level = DEBUG
logger.textPlugin.name = org.webharvest.plugin.core.TextPlugin
logger.textPlugin.level = DEBUG
logger.abstractPlugin.name = org.webharvest.plugin.AbstractPlugin
logger.abstractPlugin.level = DEBUG
logger.pluginProcessor.name = org.webharvest.runtime.processors.PluginProcessorAdapter
logger.pluginProcessor.level = DEBUG
