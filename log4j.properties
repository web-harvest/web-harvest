log4j.rootLogger=INFO, stdout
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{HH:mm:ss} %-5p %c{1} - %m%n
log4j.logger.org.webharvest.plugin.core.TemplatePlugin=DEBUG
log4j.logger.org.webharvest.plugin.core.FilePlugin=DEBUG
log4j.logger.org.webharvest.plugin=DEBUG
log4j.logger.org.webharvest.plugin.core.TextPlugin=DEBUG
log4j.logger.org.webharvest.plugin.AbstractPlugin=DEBUG
log4j.logger.org.webharvest.runtime.processors.PluginProcessorAdapter=DEBUG
