    <div class="processor-content">
        <section class="section">
            <h2 class="section-title">Overview</h2>
            <p>The <code><template></code> processor provides powerful variable interpolation and expression
evaluation within text content. It processes <code>${...</code>} expressions using the configured
scripting language (JavaScript, Groovy, or BeanShell), enabling dynamic content generation,
string building, and simple computations.</p>
        </section>

        <section class="section">
            <h2 class="section-title">Usage Examples</h2>
            
            <h3 class="subsection-title">Usage Examples</h3>
            <div class="code-window">
                <div class="window-header">
                    <div class="window-controls">
                        <span class="control red"></span>
                        <span class="control yellow"></span>
                        <span class="control green"></span>
                    </div>
                    <span class="window-title">example-1.xml</span>
                </div>
                <div class="window-content">
                    <pre><code class="language-xml"><def var="username" value="john_doe"/>
<def var="apiKey" value="abc123"/>
* <!-- Automatic template interpolation in attributes -->
<http url="https://api.example.com/user/${username}?key=${apiKey}"/>
* <!-- Explicit template processor (same result) -->
<def var="url">
<template>https://api.example.com/user/${username}?key=${apiKey}</template>
</def>
<http url="${url}"/></code></pre>
                </div>
            </div>

        </section>

        <section class="section">
            <h2 class="section-title">Important Notes</h2><ul style="line-height: 1.8;"><li>CDATA for XML:: Use <code><![CDATA[...]]></code> when template contains XML/HTML tags</li><li>Escaping:: Use <code>$${</code>} to output literal <code>${</code>} in text</li><li>Language:: Inherits from config default or specify via <code>language</code> attribute</li><li>Error handling:: Invalid expressions return empty string (logged as warning)</li><li>Thread safety:: Template evaluation is thread-safe</li></ul>
        </section>
