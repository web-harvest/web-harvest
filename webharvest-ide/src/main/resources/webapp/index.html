<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebHarvest IDE - Professional Web Scraping Editor</title>

    <!-- Enterprise Design System -->
    <link rel="stylesheet" href="static/css/enterprise.css">
    <link rel="stylesheet" href="static/css/ide-redesign.css">

    <!-- Monaco Editor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Unified Header (matching website) -->
    <header class="site-header">
        <div class="container">
            <div class="brand">
                <img src="static/img/logo.png" alt="WebHarvest" class="logo" />
                <span class="project-name">WebHarvest IDE</span>
            </div>
            <div class="ide-actions">
                <button class="btn btn-sm" onclick="window.app.openFile()" title="Open Configuration (Cmd+O)">
                    <i class="fas fa-folder-open"></i> Open
                </button>
                <button class="btn btn-sm" onclick="window.app.saveFile()" title="Save (Cmd+S)">
                    <i class="fas fa-save"></i> Save
                </button>
                <button class="btn btn-sm btn-primary" onclick="window.app.showExamplesModal()" title="Load Example">
                    <i class="fas fa-download"></i> Examples
                </button>
                <button class="btn btn-sm"
                    onclick="window.open('https://web-harvest.sourceforge.net/documentation/2.2.0/', '_blank')"
                    title="Documentation">
                    <i class="fas fa-question-circle"></i> Help
                </button>
            </div>
        </div>
    </header>

    <!-- Tab Bar (macOS-style) -->
    <div class="tab-bar">
        <div id="tabs" class="tabs"></div>
        <button class="tab-add-btn" onclick="window.app.addTab()" title="New Tab (Cmd+T)">
            <i class="fas fa-plus"></i>
        </button>
    </div>

    <!-- Main IDE Content (Split View) -->
    <div class="ide-main">
        <!-- Left Sidebar: Plugin Palette (Visual mode only) -->
        <div id="plugin-sidebar"
            style="display: none; width: 260px; background: white; border-right: 1px solid #e0e0e0; flex-direction: column;">
            <div style="padding: 16px; border-bottom: 1px solid #e0e0e0;">
                <h3
                    style="margin: 0 0 10px; font-size: 13px; font-weight: 700; text-transform: uppercase; color: #666;">
                    Plugins</h3>
                <input type="search" id="plugin-search" placeholder="Search..."
                    style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px;">
            </div>
            <div id="plugin-list" style="flex: 1; overflow-y: auto; padding: 8px;">
                <div style="padding: 48px 16px; text-align: center; color: #999;">
                    <i class="fas fa-spinner fa-spin" style="font-size: 24px;"></i>
                    <p style="margin: 12px 0 0; font-size: 13px;">Loading plugins...</p>
                </div>
            </div>
        </div>

        <!-- Center: Editor Panel -->
        <div class="editor-section">
            <div class="editor-toolbar">
                <div class="toolbar-left">
                    <span class="toolbar-title">
                        <i class="fas fa-file-code"></i>
                        <span id="currentFileName">config.xml</span>
                    </span>
                </div>
                <div class="toolbar-right">
                    <button class="btn btn-sm" onclick="window.app.toggleVisualMode()" title="Visual Designer Mode">
                        <i class="fas fa-project-diagram"></i> Visual
                    </button>
                    <button class="btn btn-sm btn-primary" onclick="window.app.runConfig()"
                        title="Run Configuration (Cmd+R)">
                        <i class="fas fa-play"></i> Run
                    </button>
                    <button class="btn btn-sm" onclick="window.app.validateConfig()" title="Validate XML">
                        <i class="fas fa-check"></i> Validate
                    </button>
                </div>
            </div>

            <!-- Progress Bar -->
            <div id="progressBar" class="progress-bar" style="display: none;">
                <div id="progressFill" class="progress-fill"></div>
                <span id="progressText" class="progress-text">0%</span>
            </div>

            <!-- Execution Controls -->
            <div id="executionControls" class="execution-controls" style="display: none;">
                <button id="pauseBtn" class="btn btn-sm btn-warning" onclick="window.app.pauseExecution()"
                    title="Pause Execution">
                    <i class="fas fa-pause"></i> Pause
                </button>
                <button id="resumeBtn" class="btn btn-sm btn-success" onclick="window.app.resumeExecution()"
                    title="Resume Execution" style="display: none;">
                    <i class="fas fa-play"></i> Resume
                </button>
                <button class="btn btn-sm btn-error" onclick="window.app.stopExecution()" title="Stop Execution">
                    <i class="fas fa-stop"></i> Stop
                </button>
            </div>

            <div id="editor" class="monaco-editor-container"></div>

            <!-- Visual Designer Canvas (hidden by default) -->
            <div id="visual-canvas" style="display: none; flex: 1; background: #f5f5f5; padding: 0; width: 100%;">
                <div id="canvas-area"
                    style="background: white; padding: 24px; min-height: 100%; width: 100%; box-sizing: border-box;"
                    ondrop="app.handleDrop(event)" ondragover="app.handleDragOver(event)">
                    <!-- Visual nodes will be rendered here -->
                </div>
            </div>
        </div>

        <!-- Right: Property Panel (Visual Mode only, hidden by default) -->
        <div id="propertyPanel"
            style="display: none; width: 300px; background: white; border-left: 1px solid #e0e0e0; flex-direction: column; overflow-y: auto;">
            <!-- Properties will be rendered here by PropertyPanel.ts -->
        </div>

        <!-- Right: Sidebar Panel (30%) -->
        <div class="sidebar-section">
            <!-- Sidebar Tab Navigation -->
            <div class="sidebar-nav">
                <button class="sidebar-nav-btn active" data-panel="logs"
                    onclick="window.app.switchSidebarPanel('logs')">
                    <i class="fas fa-list-ul"></i>
                    <span>Logs</span>
                    <span class="badge" id="logsBadge">0</span>
                </button>
                <button class="sidebar-nav-btn" data-panel="results" onclick="window.app.switchSidebarPanel('results')">
                    <i class="fas fa-table"></i>
                    <span>Results</span>
                </button>
                <button class="sidebar-nav-btn" data-panel="variables"
                    onclick="window.app.switchSidebarPanel('variables')">
                    <i class="fas fa-box"></i>
                    <span>Variables</span>
                    <span class="badge" id="varsBadge">0</span>
                </button>
                <button class="sidebar-nav-btn" data-panel="session" onclick="window.app.switchSidebarPanel('session')">
                    <i class="fas fa-info-circle"></i>
                    <span>Session</span>
                </button>
            </div>

            <!-- Sidebar Content Area -->
            <div class="sidebar-content">
                <!-- Logs Panel -->
                <div id="logsPanel" class="sidebar-panel active">
                    <div class="panel-header">
                        <h3>Execution Logs</h3>
                        <button class="btn-icon" onclick="window.app.clearLogs()" title="Clear Logs">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                    <div class="panel-body">
                        <div id="logs" class="logs-list">
                            <!-- Logs rendered by LogsPanel.ts -->
                        </div>
                    </div>
                </div>

                <!-- Results Panel -->
                <div id="resultsPanel" class="sidebar-panel">
                    <div class="panel-header">
                        <h3>Results</h3>
                        <button class="btn-icon" onclick="window.app.exportResults()" title="Export Results">
                            <i class="fas fa-download"></i>
                        </button>
                    </div>
                    <div class="panel-body">
                        <div id="results" class="results-tree">
                            <!-- Results rendered by ResultsPanel.ts -->
                        </div>
                    </div>
                </div>

                <!-- Variables Panel -->
                <div id="variablesPanel" class="sidebar-panel">
                    <div class="panel-header">
                        <h3>Variables</h3>
                        <input type="search" placeholder="Filter..." class="search-input"
                            onkeyup="app.filterVariables(this.value)">
                    </div>
                    <div class="panel-body">
                        <div id="variables" class="variables-list">
                            <!-- Variables rendered by VariablesPanel.ts -->
                        </div>
                    </div>
                </div>

                <!-- Session Panel -->
                <div id="sessionPanel" class="sidebar-panel">
                    <div class="panel-header">
                        <h3>Session</h3>
                    </div>
                    <div class="panel-body">
                        <div id="session" class="session-info">
                            <!-- Session rendered by SessionPanel.ts -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Resize Handle -->
        <div class="resize-handle" id="resizeHandle"></div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
        <div class="status-left">
            <span id="statusMessage">
                <i class="fas fa-circle" style="color: var(--lime);"></i> Ready
            </span>
        </div>
        <div class="status-right">
            <span id="cursorPosition">Ln 1, Col 1</span>
            <span>XML</span>
            <span>UTF-8</span>
        </div>
    </div>

    <!-- Examples Modal -->
    <div id="examplesModal" class="modal">
        <div class="modal-overlay" onclick="window.app.hideExamplesModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Load Example Configuration</h2>
                <button class="btn-icon" onclick="window.app.hideExamplesModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="examples-grid" id="examplesGrid">
                    <!-- Populated dynamically from /examples/ -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="window.app.hideExamplesModal()">
                    <i class="fas fa-times"></i> Close
                </button>
            </div>
        </div>
    </div>

    <!-- Plugin Help Tooltip -->
    <div id="pluginTooltip" class="plugin-tooltip" style="display: none;">
        <div class="tooltip-header">
            <strong id="tooltipTitle"></strong>
            <button class="btn-icon-sm" onclick="window.app.hideTooltip()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="tooltip-body">
            <p id="tooltipDescription"></p>
            <a id="tooltipLink" href="#" target="_blank" class="tooltip-link">
                <i class="fas fa-external-link-alt"></i> View Documentation
            </a>
        </div>
    </div>

    <!-- TypeScript Application -->
    <script type="module" crossorigin src="dist/assets/main.js"></script>
    <link rel="stylesheet" crossorigin href="dist/assets/main.css">
</body>

</html>
