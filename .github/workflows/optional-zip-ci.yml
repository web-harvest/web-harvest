name: Optional ZIP Module CI

# The Java 17 full-reactor workflow already verifies ZIP and Core on every relevant PR.
# Keep this focused module workflow available for deliberate manual diagnostics only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optional-zip-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  zip-module-verify:
    name: Manual ZIP module verify (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify ZIP extension and Core dependencies
        run: mvn -B -ntp -pl webharvest-zip -am verify
