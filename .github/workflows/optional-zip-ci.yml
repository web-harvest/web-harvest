name: Optional ZIP Module CI

on:
  pull_request:
    paths:
      - "webharvest-zip/**"
      - "webharvest-core/**"
      - "pom.xml"
      - ".github/workflows/optional-zip-ci.yml"
  push:
    branches:
      - main
    paths:
      - "webharvest-zip/**"
      - "webharvest-core/**"
      - "pom.xml"
      - ".github/workflows/optional-zip-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zip-module-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Verify ZIP extension and Core dependencies
        run: mvn -B -ntp -pl webharvest-zip -am verify
