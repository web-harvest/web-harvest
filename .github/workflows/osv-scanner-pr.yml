name: OSV Scanner PR Scan

on:
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main

concurrency:
  group: osv-pr-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-pr:
    name: Aggregate Maven SBOM scan (base vs head)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run fail-closed validator regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/ci -p 'test_osv_sbom.py' -v
          cp tools/ci/osv_sbom.py "${RUNNER_TEMP}/osv_sbom.py"

      - name: Resolve exact base and head commits
        id: revisions
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base_sha="${PR_BASE_SHA:-${GROUP_BASE_SHA:-}}"
          head_sha="${PR_HEAD_SHA:-${GROUP_HEAD_SHA:-${EVENT_SHA}}}"
          [[ "${base_sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not resolve a full base commit SHA for this event."
            exit 1
          }
          [[ "${head_sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not resolve a full head commit SHA for this event."
            exit 1
          }
          echo "base_sha=${base_sha}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"
          echo "Base: ${base_sha}"
          echo "Head: ${head_sha}"

      - name: Pull pinned OSV-Scanner image
        run: docker pull ghcr.io/google/osv-scanner:v2.7.1

      - name: Generate and validate base production and test SBOMs
        shell: bash
        env:
          REVISION: ${{ steps.revisions.outputs.base_sha }}
        run: |
          set -euo pipefail
          git checkout --detach "${REVISION}"
          git clean -ffdx
          root="${RUNNER_TEMP}/osv-sbom/base"
          mkdir -p "${root}/production" "${root}/test"

          mvn --batch-mode --no-transfer-progress -DskipTests \
            -DincludeTestScope=false -DoutputFormat=json -DoutputName=bom \
            -DoutputDirectory="${root}/production" -DoutputReactorProjects=false \
            -Dcyclonedx.skipAttach=true \
            org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom

          mvn --batch-mode --no-transfer-progress -DskipTests \
            -DincludeCompileScope=false -DincludeProvidedScope=false \
            -DincludeRuntimeScope=false -DincludeSystemScope=false -DincludeTestScope=true \
            -DoutputFormat=json -DoutputName=bom \
            -DoutputDirectory="${root}/test" -DoutputReactorProjects=false \
            -Dcyclonedx.skipAttach=true \
            org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom

          python3 "${RUNNER_TEMP}/osv_sbom.py" validate-sbom "${root}/production/bom.json"
          python3 "${RUNNER_TEMP}/osv_sbom.py" validate-sbom "${root}/test/bom.json"

      - name: Generate and validate head production and test SBOMs
        shell: bash
        env:
          REVISION: ${{ steps.revisions.outputs.head_sha }}
        run: |
          set -euo pipefail
          git checkout --detach "${REVISION}"
          git clean -ffdx
          root="${RUNNER_TEMP}/osv-sbom/head"
          mkdir -p "${root}/production" "${root}/test"

          mvn --batch-mode --no-transfer-progress -DskipTests \
            -DincludeTestScope=false -DoutputFormat=json -DoutputName=bom \
            -DoutputDirectory="${root}/production" -DoutputReactorProjects=false \
            -Dcyclonedx.skipAttach=true \
            org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom

          mvn --batch-mode --no-transfer-progress -DskipTests \
            -DincludeCompileScope=false -DincludeProvidedScope=false \
            -DincludeRuntimeScope=false -DincludeSystemScope=false -DincludeTestScope=true \
            -DoutputFormat=json -DoutputName=bom \
            -DoutputDirectory="${root}/test" -DoutputReactorProjects=false \
            -Dcyclonedx.skipAttach=true \
            org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom

          python3 "${RUNNER_TEMP}/osv_sbom.py" validate-sbom "${root}/production/bom.json"
          python3 "${RUNNER_TEMP}/osv_sbom.py" validate-sbom "${root}/test/bom.json"

      - name: Scan all four isolated SBOMs and validate raw outcomes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/osv-results
          scan_sbom() {
            local label="$1"
            local sbom="$2"
            local output="target/osv-results/${label}.json"
            local log="target/osv-results/${label}.stderr.log"
            local status

            set +e
            docker run --rm \
              --volume "$(dirname "${sbom}"):/sbom:ro" \
              ghcr.io/google/osv-scanner:v2.7.1 \
              scan source --format=json --all-packages --lockfile=/sbom/bom.json \
              > "${output}" 2> "${log}"
            status=$?
            set -e

            printf '%s\n' "${status}" > "${output}.exit-code"
            python3 "${RUNNER_TEMP}/osv_sbom.py" validate-scan "${output}" --exit-code "${status}"
          }

          scan_sbom base-production "${RUNNER_TEMP}/osv-sbom/base/production/bom.json"
          scan_sbom head-production "${RUNNER_TEMP}/osv-sbom/head/production/bom.json"
          scan_sbom base-test "${RUNNER_TEMP}/osv-sbom/base/test/bom.json"
          scan_sbom head-test "${RUNNER_TEMP}/osv-sbom/head/test/bom.json"

      - name: Compare base/head production and test-only findings
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 "${RUNNER_TEMP}/osv_sbom.py" compare \
            target/osv-results/base-production.json target/osv-results/head-production.json \
            --output target/osv-results/production-new-findings.json
          production_status=$?
          python3 "${RUNNER_TEMP}/osv_sbom.py" compare \
            target/osv-results/base-test.json target/osv-results/head-test.json \
            --output target/osv-results/test-only-new-findings.json
          test_status=$?
          set -e

          if [[ "${production_status}" -gt 1 || "${test_status}" -gt 1 ]]; then
            echo "::error::Base/head comparison failed validation."
            exit 1
          fi
          echo "production_new=${production_status}" >> "${GITHUB_OUTPUT}"
          echo "test_new=${test_status}" >> "${GITHUB_OUTPUT}"

      - name: Upload SBOMs, raw scanner outputs and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-cyclonedx-evidence
          path: |
            ${{ runner.temp }}/osv-sbom/
            target/osv-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail on newly introduced vulnerabilities
        if: ${{ always() }}
        shell: bash
        env:
          PRODUCTION_NEW: ${{ steps.compare.outputs.production_new }}
          TEST_NEW: ${{ steps.compare.outputs.test_new }}
        run: |
          set -euo pipefail
          if [[ "${PRODUCTION_NEW:-}" == "1" || "${TEST_NEW:-}" == "1" ]]; then
            echo "::error::New OSV vulnerabilities were introduced. See the production/test-only comparison artifacts."
            exit 1
          fi
          if [[ "${PRODUCTION_NEW:-}" != "0" || "${TEST_NEW:-}" != "0" ]]; then
            echo "::error::OSV base/head comparison did not complete."
            exit 1
          fi
