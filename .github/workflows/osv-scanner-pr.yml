name: OSV Scanner PR Scan

on:
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main

concurrency:
  group: osv-pr-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-pr:
    uses: web-harvest/web-harvest/.github/workflows/osv-scanner-pr.yml@8a962718abca55ba2c65e304ee6400493342c805 # temporary exact-SHA validation of PR #277 implementation
    permissions:
      actions: read
      contents: read
      security-events: write
