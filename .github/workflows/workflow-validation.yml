name: Workflow Configuration Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-validation-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install verified actionlint binary
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' \
            "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8" \
            "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
      - name: Validate workflow syntax and expressions
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/actionlint" -color .github/workflows/*.yml
      - name: Set up Java 17 with the pinned setup-java action
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify Java runtime
        run: java -version
      - name: Prepare action smoke artifact
        run: |
          mkdir -p "$RUNNER_TEMP/action-smoke"
          java -version 2> "$RUNNER_TEMP/action-smoke/java-version.txt"
          printf '%s\n' 'checkout v7.0.1' 'setup-java v6.3.0' 'upload-artifact v7.0.2' > "$RUNNER_TEMP/action-smoke/actions.txt"
      - name: Verify pinned upload-artifact action
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-action-smoke
          path: "$RUNNER_TEMP/action-smoke/"
          if-no-files-found: error
          retention-days: 1
