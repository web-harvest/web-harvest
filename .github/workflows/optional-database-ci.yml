name: Optional Database Module CI

on:
  pull_request:
    paths:
      - "webharvest-database/**"
      - "webharvest-ide/**"
  push:
    branches:
      - main
    paths:
      - "webharvest-database/**"
      - "webharvest-ide/**"
      - ".github/workflows/optional-database-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optional-database-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ide-session-lifecycle:
    name: IDE EventBus lifecycle regression tests
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify IDE session EventBus wiring used by Database cleanup
        run: mvn -B -ntp -pl webharvest-ide -am -Dtest=ExecutionManagerSessionLifecycleTest,ScrapingHarvesterTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-ide-lifecycle-surefire
          path: |
            **/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 14

  database-module-coverage:
    name: Manual Database verify and JaCoCo diagnostics
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify Database extension and Core dependencies
        run: mvn -B -ntp -pl webharvest-database -am verify
      - name: Report class-level JaCoCo gaps
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          report = Path("webharvest-database/target/site/jacoco/jacoco.csv")
          if not report.is_file():
              print(f"JaCoCo CSV not found: {report}")
              raise SystemExit(0)

          with report.open(newline="", encoding="utf-8") as stream:
              rows = list(csv.DictReader(stream))

          classes = [row for row in rows if row.get("CLASS") != "Total"]
          classes.sort(
              key=lambda row: (
                  int(row["INSTRUCTION_MISSED"]),
                  int(row["BRANCH_MISSED"]),
              ),
              reverse=True,
          )
          print("JaCoCo class coverage (largest instruction/branch gaps first):")
          for row in classes:
              missed_i = int(row["INSTRUCTION_MISSED"])
              covered_i = int(row["INSTRUCTION_COVERED"])
              missed_b = int(row["BRANCH_MISSED"])
              covered_b = int(row["BRANCH_COVERED"])
              total_i = missed_i + covered_i
              total_b = missed_b + covered_b
              instruction_pct = 100 * covered_i / total_i if total_i else 100
              branch_pct = 100 * covered_b / total_b if total_b else 100
              print(
                  f'{row["PACKAGE"]}.{row["CLASS"]}: '
                  f'instructions={instruction_pct:.1f}% '
                  f'({covered_i}/{total_i}), '
                  f'branches={branch_pct:.1f}% ({covered_b}/{total_b})'
              )
          PY
      - name: Upload Database coverage diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-module-coverage-diagnostics
          path: |
            webharvest-database/target/site/jacoco/**
            webharvest-database/target/jacoco.exec
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 14
