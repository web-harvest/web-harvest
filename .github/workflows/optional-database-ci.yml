name: Optional Database Module CI

on:
  pull_request:
    paths:
      - "webharvest-database/**"
      - "webharvest-core/**"
      - "pom.xml"
      - ".github/workflows/optional-database-ci.yml"
  push:
    branches:
      - main
    paths:
      - "webharvest-database/**"
      - "webharvest-core/**"
      - "pom.xml"
      - ".github/workflows/optional-database-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-module-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Verify Database extension and Core dependencies
        run: mvn -B -ntp -pl webharvest-database -am verify
