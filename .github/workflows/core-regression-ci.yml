name: Core Regression CI

on:
  push:
    branches:
      - recovery/uncommitted-development
    paths:
      - "webharvest-core/**"
      - "pom.xml"
      - ".github/workflows/core-regression-ci.yml"
  pull_request:
    branches:
      - recovery/uncommitted-development
    paths:
      - "webharvest-core/**"
      - "pom.xml"
      - ".github/workflows/core-regression-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-verify:
    name: Full Core verify (Java 11)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Run complete Core verify lifecycle
        run: mvn --batch-mode --no-transfer-progress -pl webharvest-core -am verify

      - name: Upload Surefire and Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-regression-surefire-failsafe
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 14
