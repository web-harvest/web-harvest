name: FTP Module Coverage CI

on:
  pull_request:
    paths:
      - "pom.xml"
      - "webharvest-core/**"
      - "webharvest-ftp/**"
      - ".github/workflows/ftp-coverage.yml"
  push:
    branches:
      - main
    paths:
      - "pom.xml"
      - "webharvest-core/**"
      - "webharvest-ftp/**"
      - ".github/workflows/ftp-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftp-coverage-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ftp-module-coverage:
    name: FTP tests + JaCoCo 80% gate (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Record toolchain
        run: |
          java -version
          mvn --version
      - name: Verify FTP module and Core dependency with JaCoCo enabled
        env:
          JAVA_TOOL_OPTIONS: >-
            --add-opens=java.xml/jdk.xml.internal=ALL-UNNAMED
            --add-opens=java.base/java.lang=ALL-UNNAMED
            --add-opens=java.base/java.lang.reflect=ALL-UNNAMED
            --add-opens=java.base/java.util=ALL-UNNAMED
        run: mvn --batch-mode --no-transfer-progress -Pskip-core-tests-in-reactor -pl webharvest-ftp -am clean verify
      - name: Enforce FTP instruction and branch coverage >=80%
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          candidates = [
              Path("webharvest-ftp/target/jacoco-report/jacoco.xml"),
              Path("webharvest-ftp/target/site/jacoco/jacoco.xml"),
          ]
          report = next((path for path in candidates if path.is_file()), None)
          if report is None:
              raise SystemExit("FTP JaCoCo XML report missing: coverage gate cannot pass.")

          root = ET.parse(report).getroot()
          counters = {node.attrib["type"]: node.attrib for node in root.findall("counter")}
          failures = []
          for kind in ("INSTRUCTION", "BRANCH"):
              counter = counters.get(kind)
              if counter is None:
                  failures.append(f"{kind}: counter missing")
                  continue
              covered = int(counter["covered"])
              missed = int(counter["missed"])
              total = covered + missed
              if total == 0:
                  failures.append(f"{kind}: counter has no executable items")
                  continue
              ratio = covered / total
              print(f"{kind}: {ratio:.1%} ({covered}/{total})")
              if ratio < 0.80:
                  failures.append(f"{kind}: {ratio:.1%} is below required 80.0%")

          if failures:
              raise SystemExit("FTP JaCoCo gate failed: " + "; ".join(failures))
          print("FTP JaCoCo gate passed: instruction and branch coverage are both >=80%.")
          PY
      - name: Upload FTP coverage diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ftp-module-coverage-diagnostics
          path: |
            webharvest-ftp/target/jacoco-report/**
            webharvest-ftp/target/site/jacoco/**
            webharvest-ftp/target/jacoco.exec
            webharvest-ftp/target/surefire-reports/**
            webharvest-ftp/target/failsafe-reports/**
            webharvest-core/target/jacoco-report/**
            webharvest-core/target/site/jacoco/**
            webharvest-core/target/jacoco.exec
          if-no-files-found: warn
          retention-days: 14
