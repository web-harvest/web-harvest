name: Documentation Module CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs-module-ci.yml"
  push:
    branches:
      - main
      - "maintenance/**"
    paths:
      - "docs/**"
      - ".github/workflows/docs-module-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-module-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  docs-verify:
    name: Docs module verify (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify docs module
        run: mvn --batch-mode --no-transfer-progress -f docs/pom.xml verify
      - name: Generate full documentation site
        run: mvn --batch-mode --no-transfer-progress -f docs/pom.xml -Pfull-docs site
      - name: Upload documentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-module-diagnostics
          path: |
            docs/target/surefire-reports/**
            docs/target/site/**
          if-no-files-found: warn
          retention-days: 14
