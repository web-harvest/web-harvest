name: Documentation Module CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
  push:
    branches:
      - main
      - "maintenance/**"
    paths:
      - "docs/**"
      - ".github/workflows/docs-module-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-module-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  docs-verify:
    name: Docs module verify (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify docs module
        run: mvn --batch-mode --no-transfer-progress -f docs/pom.xml verify
      - name: Generate full documentation site
        run: mvn --batch-mode --no-transfer-progress -f docs/pom.xml -Pfull-docs site
      - name: Upload documentation diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-module-diagnostics
          path: |
            docs/target/surefire-reports/**
            docs/target/site/**
          if-no-files-found: warn
          retention-days: 14
