# Temporary bootstrap workflow. Remove this file after collecting the generated lockfile artifact.
name: Bootstrap GitHub Actions dependency lockfile

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/actions-lock-bootstrap.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install official lockfile extension
        run: gh extension install github/gh-actions-lock --pin v0.5.0
      - name: Generate lockfile for the final workflow set
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/actions-lock-bootstrap.yml
          gh actions-lock --no-narrow
          test -s .github/workflows/actions.lock
          echo "Generated lockfile:"
          sed -n '1,240p' .github/workflows/actions.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-actions-lock
          path: .github/workflows/actions.lock
          if-no-files-found: error
          retention-days: 7
