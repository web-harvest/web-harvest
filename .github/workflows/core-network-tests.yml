name: Core Network Tests

on:
  workflow_dispatch:
  # Branch-scoped push trigger validates the new workflow before it is merged.
  push:
    branches:
      - ci/core-network-test-path
  pull_request:
    branches:
      - main
    paths:
      - "webharvest-core/pom.xml"
      - ".github/workflows/core-network-tests.yml"
      - "CONTRIBUTING.md"

permissions:
  contents: read

concurrency:
  group: core-network-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  network-tests:
    # Run automatically for this implementation PR only; after merge, use workflow_dispatch.
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'ci/core-network-test-path'
    name: Core TestNG network group (Java 11)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Verify effective network-test selection
        shell: bash
        run: |
          mvn --batch-mode --no-transfer-progress -pl webharvest-core -Pnetwork-tests help:effective-pom -Doutput=target/network-tests-effective-pom.xml
          EFFECTIVE_POM="webharvest-core/target/network-tests-effective-pom.xml"
          test -s "$EFFECTIVE_POM"
          test "$(grep -Fc '<groups>network</groups>' "$EFFECTIVE_POM")" -ge 2
          test "$(grep -Fc '<excludedGroups>__webharvest_no_matching_test_group__</excludedGroups>' "$EFFECTIVE_POM")" -ge 2
      - name: Run network-tagged Core unit and integration tests
        run: mvn --batch-mode --no-transfer-progress -pl webharvest-core -am -Pnetwork-tests test-compile surefire:test failsafe:integration-test failsafe:verify
      - name: Upload Surefire and Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-network-surefire-failsafe
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            webharvest-core/target/network-tests-effective-pom.xml
          if-no-files-found: warn
          retention-days: 14
