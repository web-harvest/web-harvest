name: Optional WebBrowser Module CI

# The Java 17 full-reactor workflow already verifies WebBrowser and CLI on PRs.
# Keep this extended dependency/coverage diagnostic workflow manually runnable.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optional-webbrowser-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  webbrowser-module-verify:
    name: Manual WebBrowser module diagnostics (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Capture resolved WebBrowser dependency tree
        run: |
          mvn --batch-mode --no-transfer-progress -pl webharvest-webbrowser -am -DskipTests org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree -Dscope=test -Dverbose -DoutputFile=target/dependency-tree.txt
      - name: Verify WebBrowser module and Core
        run: mvn --batch-mode --no-transfer-progress -pl webharvest-webbrowser -am verify
      - name: Run tests for all CLI-distributed modules
        if: always()
        run: mvn --batch-mode --no-transfer-progress -pl webharvest-cli -am test
      - name: Generate WebBrowser JaCoCo report
        if: always()
        run: mvn --batch-mode --no-transfer-progress -pl webharvest-webbrowser jacoco:report
      - name: Upload WebBrowser regression and dependency diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webbrowser-module-diagnostics
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            webharvest-webbrowser/target/dependency-tree.txt
            webharvest-webbrowser/target/jacoco-report/**
            webharvest-webbrowser/target/site/jacoco/**
            webharvest-webbrowser/target/jacoco.exec
            webharvest-core/target/jacoco-report/**
            webharvest-core/target/jacoco.exec
          if-no-files-found: warn
          retention-days: 14
