name: Semantic Core Contract CI

on:
  # Implementation branches are validated by pull_request events to avoid
  # duplicate three-job runs for the same SHA. Keep push validation for the
  # recovery integration baseline, which may be updated outside a PR.
  push:
    branches:
      - recovery/uncommitted-development
    paths:
      - "webharvest-core/**"
      - "pom.xml"
      - "checkstyle.xml"
      - "spotbugs-include.xml"
      - ".github/workflows/semantic-core-ci.yml"
  pull_request:
    branches:
      - recovery/uncommitted-development
      - ci/core-regression-remediation
      - "implementation/**"
    paths:
      - "webharvest-core/**"
      - "pom.xml"
      - "checkstyle.xml"
      - "spotbugs-include.xml"
      - ".github/workflows/semantic-core-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests (Java 11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Run Semantic Core contract tests
        run: mvn -B -ntp -pl webharvest-core -am -Dtest=SemanticModelTest,SemanticModelLimitsAndInspectionTest,SemanticXmlAnalyzerLexicalHandlerTest,PluginDescriptorIndexTest,StructuralValidationTest,StructuralValidationAdversarialTest -Dsurefire.failIfNoSpecifiedTests=false test

  core-regression:
    name: Full Core test suites (Java 11; Surefire/Failsafe diagnostics)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Run Core unit tests (Surefire)
        # Keep this as a separate Maven invocation so a Surefire failure cannot prevent Failsafe diagnostics.
        run: mvn --batch-mode --no-transfer-progress -Dcheckstyle.skip=true -pl webharvest-core -am test
      - name: Run Core integration tests (Failsafe)
        if: always()
        # Invoke test-compile plus Failsafe goals directly. This still runs after Surefire fails,
        # while avoiding a second Surefire execution. The unqualified verify job owns the Checkstyle gate.
        run: mvn --batch-mode --no-transfer-progress -Dcheckstyle.skip=true -pl webharvest-core -am test-compile failsafe:integration-test failsafe:verify
      - name: Upload Surefire and Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-regression-surefire-failsafe
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 14

  core-final-verify:
    name: Unqualified Core verify (Checkstyle + full tests)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Run unqualified Core verify
        run: mvn --batch-mode --no-transfer-progress -pl webharvest-core -am verify
      - name: Run Checkstyle independently if full verify is blocked
        if: failure()
        run: mvn --batch-mode --no-transfer-progress -pl webharvest-core -am checkstyle:check
      - name: Verify and inventory JaCoCo report output
        if: always()
        shell: bash
        run: |
          echo "JaCoCo report files under the Core module (configured outputDirectory: target/jacoco-report):"
          find webharvest-core/target -type f \( -path '*/jacoco-report/*' -o -name 'jacoco.exec' \) -print 2>/dev/null || true
          test -s webharvest-core/target/jacoco.exec
          test -s webharvest-core/target/jacoco-report/jacoco.xml
          test -s webharvest-core/target/jacoco-report/index.html
      - name: Upload full verify quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-full-verify-quality-diagnostics
          path: |
            webharvest-core/target/jacoco-report/**
            webharvest-core/target/jacoco.exec
            **/target/jacoco-report/**
            **/target/spotbugsXml.xml
            **/target/checkstyle-result.xml
            **/target/pmd.xml
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 14
