name: Semantic Core Contract CI

on:
  push:
    branches:
      - main
      - "project/**"
      - recovery/uncommitted-development
      - stabilization/release-readiness-core
      - "implementation/**"
      - "stabilization/**"
      - "quality/**"
      - "maintenance/**"
    paths:
      - "webharvest-core/**"
      - "pom.xml"
      - "checkstyle.xml"
      - "spotbugs-include.xml"
  pull_request:
    branches:
      - main
      - recovery/uncommitted-development
      - 2.2.x
      - stabilization/release-readiness-core
      - ci/core-regression-remediation
      - "implementation/**"
      - "stabilization/**"
      - "quality/**"
      - "maintenance/**"
      - "fix/**"
      - "test/**"
      - "spike/**"
    paths:
      - "webharvest-core/**"
      - "pom.xml"
      - "checkstyle.xml"
      - "spotbugs-include.xml"
  workflow_dispatch:

concurrency:
  group: semantic-core-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-final-verify:
    name: Core verify (Checkstyle + full tests + JaCoCo)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Reject unconditional or tautological success assertions in Core tests
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          forbidden_assertions = (
              (
                  "unconditional assertTrue(true)",
                  re.compile(r"\bassertTrue\s*\(\s*true\s*(?:,\s*[^)]*)?\)", re.DOTALL),
              ),
              (
                  "tautological assertTrue(expression || !expression)",
                  re.compile(
                      r"\bassertTrue\s*\(\s*(?P<expression>[A-Za-z_$][\w$]*(?:\s*\.\s*[A-Za-z_$][\w$]*\s*\(\s*\))*)\s*\|\|\s*!\s*(?P=expression)\s*\)",
                      re.DOTALL,
                  ),
              ),
          )

          failures = []
          for source in Path("webharvest-core/src/test/java").rglob("*.java"):
              content = source.read_text(encoding="utf-8")
              for description, pattern in forbidden_assertions:
                  for match in pattern.finditer(content):
                      line = content.count("\n", 0, match.start()) + 1
                      failures.append(f"{source}:{line}: {description}")

          if failures:
              print("\n".join(failures), file=sys.stderr)
              print("::error::False-green Core assertions are forbidden.", file=sys.stderr)
              sys.exit(1)
          PY
      - name: Run unqualified Core verify
        run: mvn --batch-mode --no-transfer-progress -pl webharvest-core -am verify
      - name: Run Checkstyle independently if full verify is blocked
        if: failure()
        run: mvn --batch-mode --no-transfer-progress -pl webharvest-core -am checkstyle:check
      - name: Run Failsafe diagnostics if full verify fails
        if: failure()
        run: mvn --batch-mode --no-transfer-progress -Dcheckstyle.skip=true -pl webharvest-core -am test-compile failsafe:integration-test failsafe:verify
      - name: Verify and inventory JaCoCo report output
        if: always()
        shell: bash
        run: |
          echo "JaCoCo report files under the Core module (configured outputDirectory: target/jacoco-report):"
          find webharvest-core/target -type f \( -path '*/jacoco-report/*' -o -name 'jacoco.exec' \) -print 2>/dev/null || true
          test -s webharvest-core/target/jacoco.exec
          test -s webharvest-core/target/jacoco-report/jacoco.xml
          test -s webharvest-core/target/jacoco-report/index.html
      - name: Upload full verify quality diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-full-verify-quality-diagnostics
          path: |
            webharvest-core/target/jacoco-report/**
            webharvest-core/target/jacoco.exec
            **/target/jacoco-report/**
            **/target/spotbugsXml.xml
            **/target/checkstyle-result.xml
            **/target/pmd.xml
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 14
  groovy6-compatibility:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'spike/groovy6-')
    name: Groovy 6 JSR-223 runtime compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAVA_TOOL_OPTIONS: >-
        --add-opens=java.xml/jdk.xml.internal=ALL-UNNAMED
        --add-opens=java.base/java.lang=ALL-UNNAMED
        --add-opens=java.base/java.lang.reflect=ALL-UNNAMED
        --add-opens=java.base/java.util=ALL-UNNAMED
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Record toolchain
        run: |
          java -version
          mvn --version
      - name: Verify isolated Groovy 6 dependency graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p webharvest-core/target
          mvn --batch-mode --no-transfer-progress -pl webharvest-core \
            -Dgroovy6.compatibility=true \
            dependency:tree \
            -Dincludes=org.apache.groovy:*,org.codehaus.groovy:* \
            -DoutputFile=target/groovy6-dependency-tree.txt
          tree_file="webharvest-core/target/groovy6-dependency-tree.txt"
          cat "$tree_file"
          grep -q 'org.apache.groovy:groovy:jar:6.0.0' "$tree_file"
          grep -q 'org.apache.groovy:groovy-jsr223:jar:6.0.0' "$tree_file"
          if grep -q 'org.codehaus.groovy:groovy-all' "$tree_file"; then
            echo "::error::Legacy Groovy 2.x remains in the Groovy 6 compatibility graph."
            exit 1
          fi
      - name: Execute the real ScriptPlugin JSR-223 Groovy integration test
        run: |
          mvn --batch-mode --no-transfer-progress \
            -pl webharvest-core \
            -Dgroovy6.compatibility=true \
            -Dit.test=GroovyScriptRuntimeIntegrationTest \
            test-compile failsafe:integration-test failsafe:verify
          report="webharvest-core/target/failsafe-reports/TEST-org.webharvest.plugin.integration.GroovyScriptRuntimeIntegrationTest.xml"
          test -s "$report"
          grep -q 'tests="1"' "$report"
          grep -q 'failures="0"' "$report"
          grep -q 'errors="0"' "$report"
      - name: Upload Groovy 6 compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: groovy6-compatibility-diagnostics
          path: |
            webharvest-core/target/groovy6-dependency-tree.txt
            webharvest-core/target/failsafe-reports/**
            webharvest-core/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 14
