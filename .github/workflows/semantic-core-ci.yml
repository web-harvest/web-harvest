name: Semantic Core Contract CI

on:
  push:
    branches:
      - main
      - "project/**"
      - recovery/uncommitted-development
      - stabilization/release-readiness-core
      - "implementation/**"
      - "stabilization/**"
      - "quality/**"
      - "maintenance/**"
    paths:
      - "webharvest-core/**"
      - "pom.xml"
      - "checkstyle.xml"
      - "spotbugs-include.xml"
      - ".github/workflows/semantic-core-ci.yml"
  pull_request:
    branches:
      - main
      - recovery/uncommitted-development
      - 2.2.x
      - stabilization/release-readiness-core
      - ci/core-regression-remediation
      - "implementation/**"
      - "stabilization/**"
      - "quality/**"
      - "maintenance/**"
      - "fix/**"
      - "test/**"
    paths:
      - "webharvest-core/**"
      - "pom.xml"
      - "checkstyle.xml"
      - "spotbugs-include.xml"
      - ".github/workflows/semantic-core-ci.yml"
  workflow_dispatch:

concurrency:
  group: semantic-core-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-final-verify:
    name: Core verify (Checkstyle + full tests + JaCoCo)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run unqualified Core verify
        run: mvn --batch-mode --no-transfer-progress -pl webharvest-core -am verify
      - name: Run Checkstyle independently if full verify is blocked
        if: failure()
        run: mvn --batch-mode --no-transfer-progress -pl webharvest-core -am checkstyle:check
      - name: Run Failsafe diagnostics if full verify fails
        if: failure()
        run: mvn --batch-mode --no-transfer-progress -Dcheckstyle.skip=true -pl webharvest-core -am test-compile failsafe:integration-test failsafe:verify
      - name: Verify and inventory JaCoCo report output
        if: always()
        shell: bash
        run: |
          echo "JaCoCo report files under the Core module (configured outputDirectory: target/jacoco-report):"
          find webharvest-core/target -type f \( -path '*/jacoco-report/*' -o -name 'jacoco.exec' \) -print 2>/dev/null || true
          test -s webharvest-core/target/jacoco.exec
          test -s webharvest-core/target/jacoco-report/jacoco.xml
          test -s webharvest-core/target/jacoco-report/index.html
      - name: Upload full verify quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-full-verify-quality-diagnostics
          path: |
            webharvest-core/target/jacoco-report/**
            webharvest-core/target/jacoco.exec
            **/target/jacoco-report/**
            **/target/spotbugsXml.xml
            **/target/checkstyle-result.xml
            **/target/pmd.xml
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 14
