name: Semantic Core CI

on:
  push:
    branches:
      - recovery/uncommitted-development
    paths:
      - "webharvest-core/**"
      - "pom.xml"
      - ".github/workflows/semantic-core-ci.yml"
  pull_request:
    branches:
      - recovery/uncommitted-development
    paths:
      - "webharvest-core/**"
      - "pom.xml"
      - ".github/workflows/semantic-core-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests (Java 11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Run webharvest-core tests
        run: mvn -B -ntp -pl webharvest-core -am test
