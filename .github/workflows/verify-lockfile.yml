# Fails when actions.lock is out of sync with workflows or a locked pin no longer verifies upstream.
name: Verify GitHub Actions dependency lockfile

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install official lockfile extension
        run: gh extension install github/gh-actions-lock --pin v0.5.0
      - name: Verify lockfile and upstream provenance
        run: gh actions-lock --verify --no-narrow
      # Temporary one-time dispatch for the PR #232 FF diagnostic; remove before merge.
      - name: Dispatch broad SpotBugs diagnostic
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 232
        run: |
          gh api --method POST repos/web-harvest/web-harvest/actions/workflows/java17-reactor-compatibility.yml/dispatches \
            -f ref=main \
            -f 'inputs[broad_spotbugs]=true'
