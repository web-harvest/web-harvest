name: OSV Scanner Scheduled Scan

on:
  schedule:
    - cron: "30 12 * * 1"
  push:
    branches:
      - main
      - maintenance/osv-dependency-scanning
    paths:
      - "pom.xml"
      - "webharvest-*/pom.xml"
      - "docs/pom.xml"
      - ".github/workflows/osv-scanner-scheduled.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-scheduled:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
    with:
      scan-args: |-
        --recursive
        ./
      # Baseline scan is advisory until findings are triaged; PR scan reports newly introduced risk.
      fail-on-vuln: false
    permissions:
      actions: read
      contents: read
      security-events: write
