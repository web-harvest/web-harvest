name: Java 17 Reactor Compatibility

on:
  pull_request:
    branches:
      - main
    paths:
      - "pom.xml"
      - "webharvest-*/**"
      - "docs/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java17-reactor-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  java17-reactor:
    name: Full reactor verify (Temurin 17)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Record toolchain
        run: |
          java -version
          mvn --version
      - name: Verify complete Maven reactor on Java 17
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dcheckstyle.skip=true
          -Dpmd.skip=true
          -Dspotbugs.skip=true
          -Djacoco.skip=true
          '-DargLine=--add-opens=java.xml/jdk.xml.internal=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED'
          verify
      - name: Smoke-test packaged CLI on Java 17
        working-directory: webharvest-cli
        shell: bash
        run: |
          set -euo pipefail
          cli_jar="target/webharvest-cli-2.3.1.jar"
          test -s "$cli_jar"

          java -jar "$cli_jar" -h > target/cli-help.log 2>&1
          grep -q "WebHarvest Command Line Interface" target/cli-help.log
          grep -q "Usage:" target/cli-help.log

          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          cat > "$smoke_dir/smoke.xml" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <config xmlns="http://org.webharvest/schema/2.1/core">
            <def var="greeting">Java 17 packaged CLI smoke</def>
            <file action="write" path="smoke-result.txt">
              <get var="greeting"/>
            </file>
          </config>
          XML

          if ! java -jar "$cli_jar" "config=$smoke_dir/smoke.xml" "workdir=$smoke_dir" loglevel=debug > "$smoke_dir/cli.log" 2>&1; then
            cat "$smoke_dir/cli.log"
            exit 1
          fi
          grep -q "Java 17 packaged CLI smoke" "$smoke_dir/smoke-result.txt"
      - name: Upload Maven diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java17-reactor-diagnostics
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/*.dump
            **/target/*.dumpstream
          if-no-files-found: warn
          retention-days: 14
