name: Java 17 Reactor Static Analysis

on:
  pull_request:
    branches:
      - main
    paths:
      - "pom.xml"
      - "webharvest-*/**"
      - "docs/**"
      - "tools/ci/**"
      - ".github/workflows/java17-reactor-compatibility.yml"
  push:
    branches:
      - main
    paths:
      - "pom.xml"
      - "webharvest-*/**"
      - "docs/**"
      - ".github/workflows/java17-reactor-compatibility.yml"
  workflow_dispatch:
    inputs:
      broad_spotbugs:
        description: "Run SpotBugs without the legacy include filter (diagnostic only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: java17-reactor-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  java17-reactor:
    name: Full reactor tests + static analysis (Temurin 17)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GROOVY_COMPATIBILITY: ${{ startsWith(github.head_ref, 'spike/groovy6-reactor') || startsWith(github.head_ref, 'spike/groovy51-reactor') }}
      GROOVY_COMPATIBILITY_VERSION: ${{ startsWith(github.head_ref, 'spike/groovy51-reactor') && '5.1.3' || '6.0.0' }}
      GROOVY_PRODUCTION_MIGRATION: ${{ startsWith(github.head_ref, 'security/groovy-5.1.3-production') || startsWith(github.ref_name, 'security/groovy-5.1.3-production') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Record toolchain
        run: |
          java -version
          mvn --version
      - name: Verify complete Maven reactor, tests and static analysis on Java 17
        shell: bash
        env:
          BROAD_SPOTBUGS: ${{ inputs.broad_spotbugs || 'false' }}
          JAVA_TOOL_OPTIONS: >-
            --add-opens=java.xml/jdk.xml.internal=ALL-UNNAMED
            --add-opens=java.base/java.lang=ALL-UNNAMED
            --add-opens=java.base/java.lang.reflect=ALL-UNNAMED
            --add-opens=java.base/java.util=ALL-UNNAMED
        run: |
          set -euo pipefail
          mvn_args=(
            --batch-mode --no-transfer-progress
            -Pskip-core-tests-in-reactor
            -Djacoco.skip=true
            verify
          )
          if [[ "$GROOVY_COMPATIBILITY" == "true" ]]; then
            echo "Running the full reactor and packaged launchers with Groovy $GROOVY_COMPATIBILITY_VERSION."
            mvn_args+=("-Dgroovy.compatibility=true" "-Dgroovy.compatibility.version=$GROOVY_COMPATIBILITY_VERSION")
          else
            echo "Running the default production dependency profile."
          fi
          if [[ "$BROAD_SPOTBUGS" == "true" ]]; then
            echo "Broad SpotBugs diagnostic enabled: bypassing the legacy include filter; findings remain non-blocking."
            mvn_args+=("-Dspotbugs.includeFilterFile=")
          fi
          log_file="$(mktemp)"
          for attempt in 1 2 3; do
            if mvn "${mvn_args[@]}" >"$log_file" 2>&1; then
              cat "$log_file"
              exit 0
            else
              status=$?
            fi
            cat "$log_file"
            if ! grep -Eqi 'status code: 429|Too Many Requests' "$log_file" || [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            delay=$((attempt * 20))
            echo "Maven Central rate-limited dependency resolution (HTTP 429); retrying in ${delay}s (attempt $((attempt + 1))/3)."
            sleep "$delay"
          done
          exit 1
      - name: Verify generated Javadoc JARs and embedded HTML
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          modules=(
            webharvest-core
            webharvest-database
            webharvest-ftp
            webharvest-mail
            webharvest-webbrowser
            webharvest-zip
            webharvest-cli
            webharvest-ide
          )
          mkdir -p target/javadoc-audit
          summary="target/javadoc-audit/summary.txt"
          : > "$summary"
          for module in "${modules[@]}"; do
            jar_path="$module/target/${module}-2.3.1-javadoc.jar"
            if [[ ! -s "$jar_path" ]]; then
              echo "Missing or empty Javadoc JAR: $jar_path" >&2
              exit 1
            fi
            entries="target/javadoc-audit/${module}-jar-entries.txt"
            jar tf "$jar_path" > "$entries"
            if ! grep -qx 'index.html' "$entries"; then
              echo "Javadoc JAR has no index.html: $jar_path" >&2
              exit 1
            fi
            sha256sum "$jar_path" >> "$summary"
            printf '%s: index.html present; Javadoc JAR contains index.html\n' "$module" >> "$summary"
          done
          cat "$summary"
      - name: Smoke-test packaged CLI on Java 17
        working-directory: webharvest-cli
        shell: bash
        run: |
          set -euo pipefail
          cli_jar="target/webharvest-cli-2.3.1.jar"
          if [ ! -s "$cli_jar" ]; then
            echo "Packaged CLI JAR is missing or empty:"
            ls -la target
            exit 1
          fi

          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT

          cat > "$smoke_dir/log4j.properties" <<'PROPERTIES'
          log4j.rootLogger=INFO, console
          log4j.appender.console=org.apache.log4j.ConsoleAppender
          log4j.appender.console.Target=System.out
          log4j.appender.console.layout=org.apache.log4j.PatternLayout
          log4j.appender.console.layout.ConversionPattern=%p %c - %m%n
          PROPERTIES

          if ! java "-Dlog4j.configuration=file:$smoke_dir/log4j.properties" -jar "$cli_jar" -h > target/cli-help.log 2>&1; then
            echo "Packaged CLI help command failed:"
            cat target/cli-help.log
            exit 1
          fi
          if ! grep -q "WebHarvest Command Line Interface" target/cli-help.log; then
            echo "CLI help banner missing:"
            cat target/cli-help.log
            exit 1
          fi
          if ! grep -q "Usage:" target/cli-help.log; then
            echo "CLI usage text missing:"
            cat target/cli-help.log
            exit 1
          fi

          cat > "$smoke_dir/VerifyJavaScriptProvider.java" <<'JAVA'
          import javax.script.ScriptEngine;
          import javax.script.ScriptEngineManager;

          public final class VerifyJavaScriptProvider {
              public static void main(String[] args) throws Exception {
                  ScriptEngine engine = new ScriptEngineManager().getEngineByName("javascript");
                  if (engine == null) {
                      throw new IllegalStateException("Packaged distribution did not expose the JavaScript JSR-223 provider");
                  }
                  Object result = engine.eval("var x = 123; x + 1;");
                  if (!(result instanceof Number) || ((Number) result).intValue() != 124) {
                      throw new IllegalStateException("Unexpected packaged JavaScript evaluation result: " + result);
                  }
              }
          }
          JAVA
          echo "Compiling packaged CLI provider probe in $smoke_dir"
          if ! javac -d "$smoke_dir" "$smoke_dir/VerifyJavaScriptProvider.java" > "$smoke_dir/javac.log" 2>&1; then
            echo "javac failed:"
            cat "$smoke_dir/javac.log"
            ls -la "$smoke_dir"
            exit 1
          fi
          echo "Packaged CLI JSR-223 service descriptor:"
          if jar tf "$cli_jar" > "$smoke_dir/cli-jar-entries.txt"; then
            grep 'META-INF/services/javax.script.ScriptEngineFactory' "$smoke_dir/cli-jar-entries.txt" || echo "No JSR-223 service descriptor in CLI JAR"
          else
            echo "Could not list CLI JAR entries"
          fi
          if unzip -p "$cli_jar" META-INF/services/javax.script.ScriptEngineFactory > "$smoke_dir/cli-services.txt"; then
            cat "$smoke_dir/cli-services.txt"
          else
            echo "Could not read CLI JSR-223 service descriptor"
          fi
          if ! java -cp "$cli_jar:$smoke_dir" VerifyJavaScriptProvider > "$smoke_dir/provider.log" 2>&1; then
            echo "Packaged CLI JavaScript provider probe failed:"
            cat "$smoke_dir/provider.log"
            exit 1
          fi
          cat > "$smoke_dir/VerifyGroovyProvider.java" <<'JAVA'
          import javax.script.ScriptEngine;
          import javax.script.ScriptEngineManager;

          public final class VerifyGroovyProvider {
              public static void main(String[] args) throws Exception {
                  if (!Boolean.getBoolean("webharvest.requireGroovyCompatibility")) {
                      return;
                  }
                  ScriptEngine engine = new ScriptEngineManager().getEngineByName("groovy");
                  if (engine == null) {
                      throw new IllegalStateException("Packaged CLI did not expose the Groovy JSR-223 provider");
                  }
                  // JSR-223 engineVersion reports the engine's spec version (2.0), not Groovy's library version.
                  // Read GroovySystem from the classloader that supplied the packaged JSR-223 engine.
                  Class<?> groovySystem = Class.forName("groovy.lang.GroovySystem", true, engine.getClass().getClassLoader());
                  String version = (String) groovySystem.getMethod("getVersion").invoke(null);
                  String expectedVersion = System.getProperty("webharvest.expectedGroovyVersion", "6.0.0");
                  if (!expectedVersion.equals(version)) {
                      throw new IllegalStateException("Expected packaged Groovy " + expectedVersion + ", got GroovySystem version: " + version);
                  }
                  Object result = engine.eval("def x = 123; x + 1");
                  if (!(result instanceof Number) || ((Number) result).intValue() != 124) {
                      throw new IllegalStateException("Unexpected packaged Groovy evaluation result: " + result);
                  }
              }
          }
          JAVA
          javac -d "$smoke_dir" "$smoke_dir/VerifyGroovyProvider.java"
          provider_args=()
          if [[ "$GROOVY_COMPATIBILITY" == "true" ]]; then
            provider_args+=("-Dwebharvest.requireGroovyCompatibility=true" "-Dwebharvest.expectedGroovyVersion=$GROOVY_COMPATIBILITY_VERSION")
          elif [[ "$GROOVY_PRODUCTION_MIGRATION" == "true" ]]; then
            provider_args+=("-Dwebharvest.requireGroovyCompatibility=true" "-Dwebharvest.expectedGroovyVersion=5.1.3")
          fi
          java "${provider_args[@]}" -cp "$cli_jar:$smoke_dir" VerifyGroovyProvider

          cat > "$smoke_dir/smoke.xml" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <config xmlns="http://org.webharvest/schema/2.1/core">
            <def var="greeting">Java 17 packaged CLI smoke</def>
            <file path="smoke-result.txt" action="write">
              <get var="greeting"/>
            </file>
          </config>
          XML

          if ! java -jar "$cli_jar" "config=$smoke_dir/smoke.xml" "workdir=$smoke_dir" loglevel=debug > "$smoke_dir/cli.log" 2>&1; then
            cat "$smoke_dir/cli.log"
            exit 1
          fi
          if [ ! -s "$smoke_dir/smoke-result.txt" ]; then
            echo "CLI exited successfully but did not create the expected absolute output path."
            echo "Smoke directory contents:"
            find "$smoke_dir" -maxdepth 3 -type f -print
            echo "Any smoke output under the checkout:"
            find "$GITHUB_WORKSPACE" -maxdepth 6 -name smoke-result.txt -type f -print
            echo "CLI log:"
            cat "$smoke_dir/cli.log"
            exit 1
          fi
          if ! grep -q "Java 17 packaged CLI smoke" "$smoke_dir/smoke-result.txt"; then
            echo "CLI output file exists but does not contain the expected payload."
            echo "Output file:"
            cat -A "$smoke_dir/smoke-result.txt"
            echo "CLI log:"
            cat "$smoke_dir/cli.log"
            exit 1
          fi
      - name: Smoke-test packaged IDE on Java 17
        shell: bash
        run: |
          set -euo pipefail
          ide_jar="webharvest-ide/target/webharvest-ide-2.3.1.jar"
          if [ ! -s "$ide_jar" ]; then
            echo "Packaged IDE JAR is missing or empty:"
            ls -la webharvest-ide/target
            exit 1
          fi

          smoke_dir="$(mktemp -d)"
          cat > "$smoke_dir/VerifyJavaScriptProvider.java" <<'JAVA'
          import javax.script.ScriptEngine;
          import javax.script.ScriptEngineManager;

          public final class VerifyJavaScriptProvider {
              public static void main(String[] args) throws Exception {
                  ScriptEngine engine = new ScriptEngineManager().getEngineByName("javascript");
                  if (engine == null) {
                      throw new IllegalStateException("Packaged IDE did not expose the JavaScript JSR-223 provider");
                  }
                  Object result = engine.eval("var x = 123; x + 1;");
                  if (!(result instanceof Number) || ((Number) result).intValue() != 124) {
                      throw new IllegalStateException("Unexpected packaged IDE JavaScript result: " + result);
                  }
              }
          }
          JAVA
          echo "Compiling packaged IDE provider probe in $smoke_dir"
          if ! javac -d "$smoke_dir" "$smoke_dir/VerifyJavaScriptProvider.java" > "$smoke_dir/javac.log" 2>&1; then
            echo "javac failed:"
            cat "$smoke_dir/javac.log"
            ls -la "$smoke_dir"
            exit 1
          fi
          echo "Packaged IDE JSR-223 service descriptor:"
          if jar tf "$ide_jar" > "$smoke_dir/ide-jar-entries.txt"; then
            grep 'META-INF/services/javax.script.ScriptEngineFactory' "$smoke_dir/ide-jar-entries.txt" || echo "No JSR-223 service descriptor in IDE JAR"
          else
            echo "Could not list IDE JAR entries"
          fi
          if unzip -p "$ide_jar" META-INF/services/javax.script.ScriptEngineFactory > "$smoke_dir/ide-services.txt"; then
            cat "$smoke_dir/ide-services.txt"
          else
            echo "Could not read IDE JSR-223 service descriptor"
          fi
          if ! java -cp "$ide_jar:$smoke_dir" VerifyJavaScriptProvider > "$smoke_dir/provider.log" 2>&1; then
            echo "Packaged IDE JavaScript provider probe failed:"
            cat "$smoke_dir/provider.log"
            exit 1
          fi
          cat > "$smoke_dir/VerifyGroovyProvider.java" <<'JAVA'
          import javax.script.ScriptEngine;
          import javax.script.ScriptEngineManager;

          public final class VerifyGroovyProvider {
              public static void main(String[] args) throws Exception {
                  if (!Boolean.getBoolean("webharvest.requireGroovyCompatibility")) {
                      return;
                  }
                  ScriptEngine engine = new ScriptEngineManager().getEngineByName("groovy");
                  if (engine == null) {
                      throw new IllegalStateException("Packaged IDE did not expose the Groovy JSR-223 provider");
                  }
                  // JSR-223 engineVersion reports the engine's spec version (2.0), not Groovy's library version.
                  // Read GroovySystem from the classloader that supplied the packaged JSR-223 engine.
                  Class<?> groovySystem = Class.forName("groovy.lang.GroovySystem", true, engine.getClass().getClassLoader());
                  String version = (String) groovySystem.getMethod("getVersion").invoke(null);
                  String expectedVersion = System.getProperty("webharvest.expectedGroovyVersion", "6.0.0");
                  if (!expectedVersion.equals(version)) {
                      throw new IllegalStateException("Expected packaged Groovy " + expectedVersion + ", got GroovySystem version: " + version);
                  }
                  Object result = engine.eval("def x = 123; x + 1");
                  if (!(result instanceof Number) || ((Number) result).intValue() != 124) {
                      throw new IllegalStateException("Unexpected packaged Groovy evaluation result: " + result);
                  }
              }
          }
          JAVA
          javac -d "$smoke_dir" "$smoke_dir/VerifyGroovyProvider.java"
          provider_args=()
          if [[ "$GROOVY_COMPATIBILITY" == "true" ]]; then
            provider_args+=("-Dwebharvest.requireGroovyCompatibility=true" "-Dwebharvest.expectedGroovyVersion=$GROOVY_COMPATIBILITY_VERSION")
          elif [[ "$GROOVY_PRODUCTION_MIGRATION" == "true" ]]; then
            provider_args+=("-Dwebharvest.requireGroovyCompatibility=true" "-Dwebharvest.expectedGroovyVersion=5.1.3")
          fi
          java "${provider_args[@]}" -cp "$ide_jar:$smoke_dir" VerifyGroovyProvider

          port=18765
          pid=""
          cleanup() {
            if [ -n "$pid" ]; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            rm -rf "$smoke_dir"
          }
          trap cleanup EXIT

          java -jar "$ide_jar" "port=$port" > "$smoke_dir/ide.log" 2>&1 &
          pid=$!

          ready=false
          for _ in $(seq 1 30); do
            if curl --silent --show-error --fail "http://127.0.0.1:$port/" -o "$smoke_dir/index.html" 2>/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$smoke_dir/ide.log"
              exit 1
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            cat "$smoke_dir/ide.log"
            echo "Packaged IDE did not become ready on port $port"
            exit 1
          fi

          grep -q "WebHarvest IDE" "$smoke_dir/index.html"
          curl --silent --show-error --fail "http://127.0.0.1:$port/static/version.json" -o "$smoke_dir/version.json"
          grep -q '"version": "2.3.1"' "$smoke_dir/version.json"
      - name: Inventory shaded CLI and IDE runtime contents
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          audit_dir="target/package-audit"
          mkdir -p "$audit_dir"
          for item in "cli:webharvest-cli/target/webharvest-cli-2.3.1.jar" "ide:webharvest-ide/target/webharvest-ide-2.3.1.jar"; do
            name="${item%%:*}"
            jar_path="${item#*:}"
            report="$audit_dir/$name"
            mkdir -p "$report"
            if [ ! -s "$jar_path" ]; then
              echo "MISSING: $jar_path" | tee "$report/status.txt"
              continue
            fi
            echo "PRESENT: $jar_path" > "$report/status.txt"
            sha256sum "$jar_path" > "$report/sha256.txt"
            jar tf "$jar_path" > "$report/all-entries.txt"
            grep -E '^(groovy/|org/codehaus/groovy/|org/apache/commons/collections/|META-INF/groovy-release-info\.properties$|META-INF/maven/(org\.codehaus\.groovy|commons-collections)/|META-INF/services/)' "$report/all-entries.txt" > "$report/relevant-entries.txt" || true

            # Preserve the actual license/NOTICE and embedded Maven metadata payloads.
            # A path-only inventory cannot establish which legal text ships in a shaded archive.
            python3 - "$jar_path" "$report" <<'PY'
          from hashlib import sha256
          from pathlib import Path, PurePosixPath
          import csv
          import re
          import sys
          import zipfile

          archive = Path(sys.argv[1])
          report = Path(sys.argv[2])
          resources = report / "resources"
          resources.mkdir(parents=True, exist_ok=True)
          manifest_path = report / "resource-manifest.tsv"
          legal_count = 0
          maven_count = 0

          with zipfile.ZipFile(archive) as jar, manifest_path.open("w", encoding="utf-8", newline="") as stream:
              writer = csv.writer(stream, delimiter="\t", lineterminator="\n")
              writer.writerow(["kind", "archive_entry", "extracted_file", "size_bytes", "sha256"])
              index = 0
              for item in jar.infolist():
                  entry = item.filename
                  if item.is_dir():
                      continue
                  basename = PurePosixPath(entry).name.lower()
                  is_maven = entry.startswith("META-INF/maven/") and basename in {"pom.properties", "pom.xml"}
                  is_legal = (
                      basename.startswith(("license", "notice", "copying", "copyright", "third-party"))
                      or basename == "dependencies"
                      or "/licenses/" in entry.lower()
                      or entry.lower().startswith("meta-inf/licenses/")
                  )
                  if not (is_maven or is_legal):
                      continue
                  payload = jar.read(item)
                  index += 1
                  safe_entry = re.sub(r"[^A-Za-z0-9._-]+", "__", entry)
                  output = resources / f"{index:04d}__{safe_entry}"
                  output.write_bytes(payload)
                  digest = sha256(payload).hexdigest()
                  kind = "maven-metadata" if is_maven else "license-notice"
                  writer.writerow([kind, entry, output.relative_to(report).as_posix(), len(payload), digest])
                  legal_count += int(is_legal)
                  maven_count += int(is_maven)

          if legal_count == 0:
              raise SystemExit(f"No license/NOTICE-like resources extracted from {archive}")
          if maven_count == 0:
              raise SystemExit(f"No embedded Maven POM metadata extracted from {archive}")
          print(f"Extracted {legal_count} license/NOTICE resources and {maven_count} Maven metadata files from {archive}")
          PY
            {
              echo "Archive: $jar_path"
              echo "SHA-256:"
              cat "$report/sha256.txt"
              echo "Relevant package/resource entries:"
              cat "$report/relevant-entries.txt"
              echo "Extracted license/NOTICE and Maven metadata resources:"
              cat "$report/resource-manifest.tsv"
            } > "$report/summary.txt"
          done
      - name: Generate and validate distribution-specific provenance inventories
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/shaded-provenance/aggregate target/shaded-provenance/reports

          python3 -m unittest discover -s tools/ci -p 'test_shaded_distribution_inventory.py' -v

          mvn --batch-mode --no-transfer-progress -DskipTests \
            -DincludeTestScope=false -DoutputFormat=json -DoutputName=bom \
            -DoutputDirectory=target/shaded-provenance/aggregate \
            -DoutputReactorProjects=false -Dcyclonedx.skipAttach=true \
            org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom

          python3 tools/ci/shaded_distribution_inventory.py \
            --archive webharvest-cli/target/webharvest-cli-2.3.1.jar \
            --distribution cli \
            --sbom target/shaded-provenance/aggregate/bom.json \
            --output target/shaded-provenance/reports/cli-provenance.json

          python3 tools/ci/shaded_distribution_inventory.py \
            --archive webharvest-ide/target/webharvest-ide-2.3.1.jar \
            --distribution ide \
            --sbom target/shaded-provenance/aggregate/bom.json \
            --output target/shaded-provenance/reports/ide-provenance.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("target/shaded-provenance/reports")
          cli = json.loads((root / "cli-provenance.json").read_text(encoding="utf-8"))
          ide = json.loads((root / "ide-provenance.json").read_text(encoding="utf-8"))
          for report in (cli, ide):
              if len(report["archive"]["sha256"]) != 64:
                  raise SystemExit("Invalid distribution archive SHA-256")
              if not report["components"] or not report["legal_resources"]:
                  raise SystemExit("Incomplete distribution component/legal-resource inventory")
          cli_jetty = cli["class_inventory"]["jetty_class_attribution"]
          if cli["class_inventory"]["org_htmlunit_jetty_classes"] == 0:
              raise SystemExit("Expected relocated HtmlUnit/Jetty class evidence in CLI")
          if cli_jetty["mapped_class_count"] != cli["class_inventory"]["org_htmlunit_jetty_classes"]:
              raise SystemExit("Not every relocated Jetty class maps to an upstream Jetty 12.1.15 module")
          if cli_jetty["unmapped_class_count"] != 0:
              raise SystemExit("Unmapped relocated Jetty classes remain in CLI")
          jetty_components = [
              component for component in cli["components"]
              if component["group"].startswith("org.eclipse.jetty") and component["version"] == "12.1.15"
          ]
          if len(jetty_components) != 12:
              raise SystemExit(f"Expected 12 Jetty 12.1.15 components in CLI; found {len(jetty_components)}")
          if any(not component["upstream_project_license_evidence"] for component in jetty_components):
              raise SystemExit("A relocated Jetty component is missing pinned upstream license/NOTICE provenance")
          if cli["jetty_notice_audit"]["content_level_reconciliation"] != "open":
              raise SystemExit("Jetty NOTICE status must remain explicitly open pending legal-resource reconciliation")
          if ide["class_inventory"]["org_eclipse_jetty_classes"] == 0:
              raise SystemExit("Expected original-namespace Jetty class evidence in IDE")
          print("Validated exact CLI/IDE archive hashes, all 1,280 relocated Jetty classes, 12 upstream module/license records and the explicit open NOTICE gate.")
          PY
      - name: Upload Maven diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java17-reactor-diagnostics
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/pmd.xml
            **/target/spotbugsXml.xml
            **/target/checkstyle-result.xml
            **/target/jacoco-report/jacoco.xml
            **/target/site/jacoco/jacoco.xml
            **/target/jacoco-report/jacoco.csv
            **/target/site/jacoco/jacoco.csv
            **/target/*.dump
            **/target/*.dumpstream
            **/target/package-audit/**
            target/shaded-provenance/**
            **/target/*-javadoc.jar
            target/javadoc-audit/**
          if-no-files-found: warn
          retention-days: 14
