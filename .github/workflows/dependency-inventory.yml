name: Dependency Inventory (Java 11)

on:
  pull_request:
    branches:
      - main
    paths:
      - "pom.xml"
      - "webharvest-*/pom.xml"
      - ".github/workflows/dependency-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-inventory-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  dependency-inventory:
    name: Resolved dependency trees and effective POMs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Capture module dependency trees and effective POMs
        shell: bash
        run: |
          set -euo pipefail
          modules=(
            webharvest-core
            webharvest-cli
            webharvest-ide
            webharvest-database
            webharvest-ftp
            webharvest-mail
            webharvest-webbrowser
            webharvest-zip
          )
          for module in "${modules[@]}"; do
            echo "::group::Dependency tree: ${module}"
            mvn --batch-mode --no-transfer-progress \
              -pl "${module}" -am -DskipTests \
              org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree \
              -Dscope=test -Dverbose \
              -DoutputFile=target/dependency-tree.txt
            echo "::endgroup::"
            echo "::group::Effective POM: ${module}"
            mvn --batch-mode --no-transfer-progress \
              -pl "${module}" -am -DskipTests \
              org.apache.maven.plugins:maven-help-plugin:3.5.1:effective-pom \
              -Doutput=target/effective-pom.xml
            echo "::endgroup::"
          done
      - name: Verify inventory artifacts exist
        if: always()
        shell: bash
        run: |
          find . -path '*/target/dependency-tree.txt' -o -path '*/target/effective-pom.xml' | sort
      - name: Upload dependency inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-dependency-inventory-java11
          path: |
            **/target/dependency-tree.txt
            **/target/effective-pom.xml
          if-no-files-found: error
          retention-days: 30
