name: TypeScript Validation

on:
  pull_request:
    branches:
      - "2.3.x"
      - "recovery/**"
      - "stabilization/**"
      - "ci/**"
      - "test/**"
  push:
    branches:
      - "recovery/**"
      - "stabilization/**"
      - "ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typescript-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-typescript-packages:
    name: Shared TypeScript packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build and smoke-test metadata-client
        working-directory: packages/visual-shared/metadata-client
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          # Isolation check: compiled output must not reach into the IDE tree
          if grep -R "webharvest-ide" dist src; then
            echo "metadata-client still references webharvest-ide" >&2
            exit 1
          fi
          npm run test:consumer

      - name: Build and smoke-test xml-roundtrip
        working-directory: packages/visual-shared/xml-roundtrip
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          if grep -R "webharvest-ide" dist src; then
            echo "xml-roundtrip still references webharvest-ide" >&2
            exit 1
          fi
          npm run test:consumer

  frontend-jest:
    name: IDE frontend checks and Jest (Node 18)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webharvest-ide/frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.19.0"
          cache: npm
          cache-dependency-path: webharvest-ide/frontend/package-lock.json

      - name: Install frontend dependencies from committed lockfile
        run: npm ci --no-audit --no-fund

      - name: Type-check frontend
        # pretest/pretype-check/prebuild install+build shared packages via scripts/build-packages.sh
        run: npm run type-check

      # Issue #26 gate: D3 must load, all 132 suites must run, and failed counts
      # must not exceed the checked-in ratchet (jest-known-failures.json).
      - name: Run frontend Jest tests
        run: |
          set -euo pipefail
          set +e
          npm test -- --runInBand --detectOpenHandles --forceExit > "${RUNNER_TEMP}/jest-output.txt" 2>&1
          jest_status=$?
          set -e
          cat "${RUNNER_TEMP}/jest-output.txt"
          node ./scripts/assert-jest-gate.mjs "${RUNNER_TEMP}/jest-output.txt"
          # assert-jest-gate encodes the acceptance gate; jest_status may be non-zero
          # when classified baseline failures remain.
          exit 0

      - name: Upload Jest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-jest-output-${{ github.run_number }}
          path: ${{ runner.temp }}/jest-output.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Build frontend
        run: npm run build

  ide-frontend-authority:
    name: Documented IDE frontend authority
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Assert retired root workspace is not a product build
        run: |
          set -euo pipefail
          test -f docs/IDE_FRONTEND_WORKSPACE.md
          test -f webharvest-ide/frontend/package.json
          test -f webharvest-ide/frontend/tsconfig.json
          # Root vite product build must remain retired
          if test -f webharvest-ide/vite.config.js; then
            echo "obsolete root vite.config.js still present" >&2
            exit 1
          fi
          if test -f webharvest-ide/tsconfig.json; then
            echo "obsolete root tsconfig.json still present; use tsconfig.base.json" >&2
            exit 1
          fi
          # Root package must not claim a product type-check/build
          python3 - <<'PY'
          import json, sys
          with open("webharvest-ide/package.json") as f:
              scripts = json.load(f).get("scripts") or {}
          forbidden = {"type-check", "build", "dev", "preview"}
          present = forbidden.intersection(scripts)
          if present:
              print(f"root package product scripts still present: {sorted(present)}", file=sys.stderr)
              sys.exit(1)
          PY

  sweep-examples:
    name: XML example semantic round-trip (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build shared XML packages
        run: bash webharvest-ide/frontend/scripts/build-packages.sh

      - name: Install sweep dependencies
        run: npm install --no-audit --no-fund --prefix webharvest-ide

      - name: Verify XML examples semantically round-trip
        run: npm run sweep:examples --prefix webharvest-ide

  ide-browser-e2e:
    name: IDE browser E2E (Playwright, Chromium)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: webharvest-ide/frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.19.0"

      - name: Install frontend and Playwright dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium-${{ github.run_number }}
          path: |
            webharvest-ide/frontend/playwright-report/
            webharvest-ide/frontend/test-results/
          if-no-files-found: warn
          retention-days: 14
