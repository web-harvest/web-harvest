name: Engineering task
description: A scoped, evidence-based task for WebHarvest
title: "[AREA] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Before marking this issue ready, read [AGENTS.md](https://github.com/web-harvest/web-harvest/blob/main/AGENTS.md), [docs/AGENT_WORKFLOW.md](https://github.com/web-harvest/web-harvest/blob/main/docs/AGENT_WORKFLOW.md), and the [Release Stabilization Gate in roadmap #1](https://github.com/web-harvest/web-harvest/issues/1). Issue forms collect triage answers but do not automatically apply repository labels.
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Select impact, not effort or age.
      options:
        - "P0 - Critical"
        - "P1 - High"
        - "P2 - Normal"
        - "P3 - Later"
        - "P4 - Backlog"
    validations:
      required: true
  - type: dropdown
    id: readiness
    attributes:
      label: Readiness
      options:
        - "needs-analysis"
        - "ready"
        - "blocked"
        - "deferred"
    validations:
      required: true
  - type: dropdown
    id: gate_workstream
    attributes:
      label: Release Gate workstream
      options:
        - "Implementation and compatibility"
        - "Tests and engineering quality"
        - "Dependencies and security"
        - "Release engineering (GitHub and Maven)"
        - "Documentation"
        - "Project website"
        - "Cross-cutting"
        - "Not release-scoped / later roadmap"
    validations:
      required: true
  - type: textarea
    id: release_impact
    attributes:
      label: Release impact and dependency
      description: Explain whether this blocks the current release, what it depends on, or why it is explicitly later scope.
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - bug
        - security
        - feature
        - maintenance
        - audit
        - architecture
        - docs
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State the problem and intended outcome.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Source paths, call sites, reproductions, CI runs. Distinguish FACT / INFERENCE / UNKNOWN / PROPOSAL.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable and testable outcomes.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and related work
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: Exact tests, workflows and compatibility checks.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Compatibility and risks
